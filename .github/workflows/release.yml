name: Release

# Gera o app com ícone para Windows, macOS (Apple Silicon e Intel) e Linux (x64 e ARM64).
# Rode manualmente (Actions > Release > Run workflow) para só testar a build,
# ou crie uma tag para publicar:  git tag v0.1.1 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            sep: ";"
            icon: teasertube/assets/icon.ico
            exe: dist/TeaserTube/TeaserTube.exe
            asset: TeaserTube-windows-x64-setup.exe
          - name: macos-apple-silicon
            os: macos-latest
            sep: ":"
            icon: teasertube/assets/icon.icns
            exe: dist/TeaserTube.app/Contents/MacOS/TeaserTube
            asset: TeaserTube-macos-apple-silicon.dmg
          - name: macos-intel
            os: macos-15-intel
            sep: ":"
            icon: teasertube/assets/icon.icns
            exe: dist/TeaserTube.app/Contents/MacOS/TeaserTube
            asset: TeaserTube-macos-intel.dmg
          # Linux é compilado numa base antiga (Debian 11, glibc 2.31) para abrir
          # em praticamente qualquer distribuição de 2020 em diante.
          - name: linux-x64
            os: ubuntu-latest
            container: python:3.12-bullseye
            sep: ":"
            icon: teasertube/assets/icon.png
            exe: dist/TeaserTube/TeaserTube
            asset: TeaserTube-linux-x64.tar.gz
          - name: linux-arm64
            os: ubuntu-24.04-arm
            container: python:3.12-bullseye
            sep: ":"
            icon: teasertube/assets/icon.png
            exe: dist/TeaserTube/TeaserTube
            asset: TeaserTube-linux-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: ${{ !matrix.container }}
        with:
          python-version: "3.12"
      - name: Dependências
        shell: bash
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Localizar o Deno
        id: deno
        shell: bash
        run: echo "path=$(python -c 'import deno; print(deno.find_deno_bin())')" >> "$GITHUB_OUTPUT"
      - name: Empacotar
        shell: bash
        env:
          DENO_BIN: ${{ steps.deno.outputs.path }}
        run: |
          python -m PyInstaller --noconfirm --windowed --name TeaserTube \
            --icon "${{ matrix.icon }}" \
            --add-data "teasertube/assets${{ matrix.sep }}teasertube/assets" \
            --add-binary "$DENO_BIN${{ matrix.sep }}bin" \
            --collect-all imageio_ffmpeg --collect-all deno --collect-all yt_dlp_ejs \
            run_teasertube.py
      - name: Conferir o app empacotado
        shell: bash
        run: |
          "${{ matrix.exe }}" --diagnostico || [ "${{ runner.os }}" = "Windows" ]
      - name: Instalador (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = python -c "import teasertube; print(teasertube.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\TeaserTube.iss
      - name: Imagem de disco (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir dmg
          ditto dist/TeaserTube.app dmg/TeaserTube.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname TeaserTube -srcfolder dmg -ov -format UDZO "${{ matrix.asset }}"
      - name: Compactar (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd dist
          tar -czf "../${{ matrix.asset }}" TeaserTube
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # criar a release
      id-token: write      # assinar o atestado de origem
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums (SHA-256)
        run: cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Atestado de origem (prova que os arquivos vieram deste repositório)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: assets/*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: TeaserTube ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: assets/*
